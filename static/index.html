<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
            padding-bottom: 120px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.5s ease;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Search */
        .search-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px;
            display: flex;
            max-width: 600px;
            margin: 0 auto 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease 0.1s both;
        }
        
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 25px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        
        .search-box button {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,210,255,0.4);
        }
        
        /* Results */
        .results {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .track {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .track:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .track img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
        }
        
        .track-info {
            flex: 1;
            margin-left: 15px;
            overflow: hidden;
        }
        
        .track-title {
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-platform {
            display: inline-block;
            background: linear-gradient(90deg, #ff0000, #ff4444);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 5px;
        }
        
        /* Player */
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15,12,41,0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.5s ease;
        }
        
        .player-info {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .player-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #00d2ff;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .control-btn.play {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            box-shadow: 0 5px 20px rgba(0,210,255,0.4);
        }
        
        .control-btn.pause {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            box-shadow: 0 5px 20px rgba(243,156,18,0.4);
        }
        
        .control-btn.next {
            background: linear-gradient(135deg, #9b59b6, #3498db);
            box-shadow: 0 5px 20px rgba(155,89,182,0.4);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
        }
        
        audio {
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
        }
        
        audio::-webkit-media-controls-panel {
            background: rgba(255,255,255,0.1);
        }
        
        /* Timer */
        .clock {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="clock" id="current-clock"></div>
    
    <div class="header">
        <h1>🎵 Music Player</h1>
    </div>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Search for your favorite music...">
        <button onclick="search()">Search</button>
    </div>
    
    <div class="results" id="results">
        <div class="loading">Search for music to get started!</div>
    </div>
    
    <div class="player-container">
        <div class="player-info">
            <div class="player-title" id="current-track">No track selected</div>
        </div>
        <div class="controls">
            <button class="control-btn play" onclick="playCurrent()">▶</button>
            <button class="control-btn pause" onclick="pauseCurrent()">⏸</button>
            <button class="control-btn next" onclick="nextTrack()">⏭</button>
        </div>
        <audio id="audio-player" controls></audio>
    </div>
    
    <script>
        let searchResults = [];
        let currentTrackTitle = '';
        let currentTrack = null;
        
        // Initialize clock
        window.onload = () => {
            setInterval(() => {
                const now = new Date();
                document.getElementById('current-clock').innerText = now.toLocaleTimeString();
            }, 1000);
        };
        
        async function search() {
            const query = document.getElementById('query').value;
            if (!query) return;
            
            document.getElementById('results').innerHTML = '<div class="loading">Searching...</div>';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                searchResults = await response.json();
                
                if (searchResults.length === 0) {
                    document.getElementById('results').innerHTML = '<div class="loading">No results found</div>';
                    return;
                }
                
                displayResults();
            } catch (error) {
                document.getElementById('results').innerHTML = '<div class="loading">Error: ' + error.message + '</div>';
            }
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = searchResults.map((track, index) => `
                <div class="track" onclick="playTrack(searchResults[${index}])">
                    <img src="${track.thumbnail}" alt="">
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <span class="track-platform">${track.platform || 'YouTube'}</span>
                    </div>
                </div>
            `).join('');
        }
        
        async function playTrack(track) {
            currentTrack = track;
            currentTrackTitle = track.title;
            document.getElementById('current-track').innerText = 'Loading: ' + track.title;
            
            const player = document.getElementById('audio-player');
            
            try {
                const platform = track.platform || 'YouTube';
                const response = await fetch(`/api/play?url=${encodeURIComponent(track.url)}&platform=${encodeURIComponent(platform)}`);
                const data = await response.json();
                
                if (data.url) {
                    if (data.url.includes('youtube.com/embed')) {
                        // Use invisible iframe for audio
                        player.style.display = 'none';
                        let iframe = document.getElementById('youtube-iframe');
                        if (!iframe) {
                            iframe = document.createElement('iframe');
                            iframe.id = 'youtube-iframe';
                            iframe.setAttribute('allow', 'autoplay');
                            iframe.style.cssText = 'position:absolute;width:1px;height:1px;border:none;opacity:0;';
                            document.body.appendChild(iframe);
                        }
                        iframe.src = data.url;
                        iframe.style.display = 'block';
                    }
                    
                    document.getElementById('current-track').innerText = 'Playing: ' + track.title;
                } else {
                    document.getElementById('current-track').innerText = 'Error: ' + (data.error || 'Could not load');
                }
            } catch (error) {
                console.error('Error playing track:', error);
            }
        }
        
        function playCurrent() {
            const player = document.getElementById('audio-player');
            if (player.src) {
                player.play();
                document.getElementById('current-track').innerText = 'Playing: ' + (currentTrackTitle || 'track');
            }
        }
        
        function pauseCurrent() {
            const player = document.getElementById('audio-player');
            player.pause();
            document.getElementById('current-track').innerText = 'Paused: ' + (currentTrackTitle || 'track');
        }
        
        function nextTrack() {
            if (searchResults.length > 0) {
                const randomIndex = Math.floor(Math.random() * searchResults.length);
                playTrack(searchResults[randomIndex]);
            }
        }
        
        // Enter key to search
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
