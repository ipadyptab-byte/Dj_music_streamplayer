<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
            padding-bottom: 120px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.5s ease;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Search */
        .search-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px;
            display: flex;
            max-width: 600px;
            margin: 0 auto 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease 0.1s both;
        }
        
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 25px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        
        .search-box button {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,210,255,0.4);
        }
        
        /* Results */
        .results {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .track {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .track:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .track img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
        }
        
        .track-info {
            flex: 1;
            margin-left: 15px;
            overflow: hidden;
        }
        
        .track-title {
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-platform {
            display: inline-block;
            background: linear-gradient(90deg, #ff0000, #ff4444);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 5px;
        }
        
        /* Player */
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15,12,41,0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.5s ease;
        }
        
        .player-info {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .player-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #00d2ff;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .control-btn.play {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            box-shadow: 0 5px 20px rgba(0,210,255,0.4);
        }
        
        .control-btn.pause {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            box-shadow: 0 5px 20px rgba(243,156,18,0.4);
        }
        
        .control-btn.next {
            background: linear-gradient(135deg, #9b59b6, #3498db);
            box-shadow: 0 5px 20px rgba(155,89,182,0.4);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
        }
        
        audio {
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
        }
        
        audio::-webkit-media-controls-panel {
            background: rgba(255,255,255,0.1);
        }
        
        /* Timer */
        .clock {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
        }
        
        /* Settings */
        .settings-section {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .settings-section h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #00d2ff;
        }
        
        .setting-desc {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 15px;
        }
        
        .prayer-section {
            border: 1px solid rgba(255,200,0,0.3);
        }
        
        .prayer-section h2 {
            color: #ffd700;
        }
        
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .setting-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        
        .setting-row input[type="text"],
        .setting-row input[type="number"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            min-width: 150px;
        }
        
        .setting-row button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            cursor: pointer;
        }
        
        .setting-row label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }
        
        .setting-status {
            font-size: 0.85rem;
            color: #00d2ff;
            padding: 8px;
            background: rgba(0,210,255,0.1);
            border-radius: 8px;
        }
        
        .setting-controls {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        .ctrl-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        
        .ctrl-btn:hover { transform: scale(1.1); }
        
        .ctrl-btn.play { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }
        .ctrl-btn.pause { background: linear-gradient(135deg, #f39c12, #e74c3c); }
        .ctrl-btn.delete { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    </style>
</head>
<body>
    <div class="clock" id="current-clock"></div>
    
    <div class="header">
        <h1>🎵 Music Player</h1>
    </div>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Search for your favorite music...">
        <button onclick="search()">Search</button>
    </div>
    
    <!-- Advt Track Settings -->
    <div class="settings-section">
        <h2>📢 Advertisement Track</h2>
        <p class="setting-desc">Plays at fixed interval while main track is playing</p>
        <div class="setting-row">
            <input type="checkbox" id="advt-enabled">
            <label>Enable Advt Track</label>
        </div>
        <div class="setting-row">
            <input type="text" id="advt-query" placeholder="Search for advt music...">
            <button onclick="searchAdvt()">Search</button>
        </div>
        <div class="setting-row">
            <label>Or upload:</label>
            <input type="file" id="advt-file" accept="audio/*">
            <button onclick="uploadAdvtFile()">Upload</button>
        </div>
        <div class="setting-row">
            <label>Play every (seconds):</label>
            <input type="number" id="advt-interval" value="300" min="60">
        </div>
        <div class="setting-row">
            <label>Duration (seconds):</label>
            <input type="number" id="advt-duration" value="30" min="5">
        </div>
        <button onclick="saveAdSettings()">Save Settings</button>
        <div class="setting-controls">
            <button class="ctrl-btn play" onclick="playAdvt()">▶</button>
            <button class="ctrl-btn pause" onclick="pauseAdvt()">⏸</button>
            <button class="ctrl-btn delete" onclick="deleteAdvt()">🗑️</button>
        </div>
        <div class="setting-status" id="advt-status">No advt track set</div>
    </div>
    
    <!-- Prayer Track Settings -->
    <div class="settings-section prayer-section">
        <h2>🕐 Prayer Track</h2>
        <p class="setting-desc">Stops all and plays at fixed time</p>
        <div class="setting-row">
            <input type="checkbox" id="prayer-enabled">
            <label>Enable Prayer Track</label>
        </div>
        <div class="setting-row">
            <input type="text" id="prayer-query" placeholder="Search for prayer/bhajan...">
            <button onclick="searchPrayer()">Search</button>
        </div>
        <div class="setting-row">
            <label>Or upload:</label>
            <input type="file" id="prayer-file" accept="audio/*">
            <button onclick="uploadPrayerFile()">Upload</button>
        </div>
        <div class="setting-row">
            <label>Prayer times (HH:MM):</label>
            <input type="text" id="prayer-times" placeholder="06:00,12:00,18:00">
        </div>
        <button onclick="savePrayerSettings()">Save Settings</button>
        <div class="setting-controls">
            <button class="ctrl-btn play" onclick="playPrayer()">▶</button>
            <button class="ctrl-btn pause" onclick="pausePrayer()">⏸</button>
            <button class="ctrl-btn delete" onclick="deletePrayer()">🗑️</button>
        </div>
        <div class="setting-status" id="prayer-status">No prayer track set</div>
    </div>
    
    <div class="results" id="results">
        <div class="loading">Search for music to get started!</div>
    </div>
    
    <div class="player-container">
        <div class="player-info">
            <div class="player-title" id="current-track">No track selected</div>
        </div>
        <div class="controls">
            <button class="control-btn play" onclick="playCurrent()">▶</button>
            <button class="control-btn pause" onclick="pauseCurrent()">⏸</button>
            <button class="control-btn next" onclick="nextTrack()">⏭</button>
        </div>
        <audio id="audio-player" controls></audio>
    </div>
    
    <script>
        let searchResults = [];
        let currentTrackTitle = '';
        let currentTrack = null;
        let advtTrack = null;
        let prayerTrack = null;
        let prayerTimes = [];
        let isYouTubePlaying = false;  // Track if YouTube is playing
        
        // Advt tracking variables
        let isAdvtPlaying = false;
        let advtPlayCount = 0;  // How many times ad was started
        let advtPlayFinished = 0;  // How many times ad finished
        let mainPausedTime = 0;
        let mainTrackInfo = null;
        let advtInterval = 300;
        let advtTimer = null;
        let advtIntervalCounter = -1;  // Countdown for next ad (-1 = not started yet)
        let prayerChecker = null;
        let shouldResumeWithSeek = false; // Track if we should seek after loading
        
        // Prayer tracking variables
        let inPrayer = false;  // Currently playing prayer
        let prayerJustEnded = false;  // Prayer just finished (for resuming)
        
        // YouTube player state callback
        function onYouTubeStateChange(event) {
            // YT.PlayerState: UNSTARTED=-1, BUFFERING=3, PLAYING=1, PAUSED=2, ENDED=0
            if (event.data === 2) { // Paused
                isYouTubePlaying = false;
            } else if (event.data === 1) { // Playing
                isYouTubePlaying = true;
                // Seek to saved position if resuming
                if (shouldResumeWithSeek && window.ytPlayer && mainPausedTime > 0) {
                    window.ytPlayer.seekTo(mainPausedTime, true);
                    shouldResumeWithSeek = false;
                }
            } else if (event.data === 0) { // Ended - resume main after advt
                if (isAdvtPlaying && mainTrackInfo) {
                    console.log('Advt ended, resuming main');
                    isAdvtPlaying = false;
                    shouldResumeWithSeek = true;
                    setTimeout(function() {
                        playTrack(mainTrackInfo);
                    }, 500);
                }
            }
        }
        
        // ===== All Functions Defined Here =====
        
        async function search() {
            const query = document.getElementById('query').value;
            if (!query) return;
            
            document.getElementById('results').innerHTML = '<div class="loading">Searching...</div>';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                searchResults = await response.json();
                
                if (searchResults.length === 0) {
                    document.getElementById('results').innerHTML = '<div class="loading">No results found</div>';
                    return;
                }
                
                displayResults();
            } catch (error) {
                document.getElementById('results').innerHTML = '<div class="loading">Error: ' + error.message + '</div>';
            }
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = searchResults.map((track, index) => `
                <div class="track" onclick="playTrack(searchResults[${index}])">
                    <img src="${track.thumbnail}" alt="">
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <span class="track-platform">${track.platform || 'YouTube'}</span>
                    </div>
                </div>
            `).join('');
        }
        
        async function playTrack(track) {
            currentTrack = track;
            currentTrackTitle = track.title;
            document.getElementById('current-track').innerText = 'Loading: ' + track.title;
            
            const player = document.getElementById('audio-player');
            
            // Determine if this track is the advertisement or prayer
            const isPlayingAdvt = (track === advtTrack);
            const isPlayingPrayer = (track === prayerTrack);
            
            // Handle Blob URLs (local files)
            if (track.isBlob || track.url.startsWith('blob:')) {
                player.src = track.url;
                player.style.display = 'block';
                const iframe = document.getElementById('youtube-iframe');
                if (iframe) iframe.src = '';
                player.play().catch(e => console.error('Play error:', e));
                
                // Track which track is playing
                if (isPlayingAdvt) {
                    isAdvtPlaying = true;
                    inPrayer = false;
                    console.log('Now playing advt track (blob)!');
                } else if (isPlayingPrayer) {
                    inPrayer = true;
                    isAdvtPlaying = false;
                    console.log('Now playing prayer track!');
                } else {
                    inPrayer = false;
                    isAdvtPlaying = false;
                    mainTrackInfo = {...track};
                    if (isYouTubePlaying && window.ytPlayer) {
                        mainPausedTime = window.ytPlayer.getCurrentTime() || 0;
                    } else {
                        mainPausedTime = player.currentTime || 0;
                    }
                    console.log('Main track saved for resume: ' + track.title);
                }
                
                document.getElementById('current-track').innerText = 'Playing: ' + track.title;
                return;
            }
            
            // For direct HTTP URLs (Supabase Storage, etc.) - use directly without API
            if (track.url.startsWith('http')) {
                player.src = track.url;
                player.style.display = 'block';
                const iframe = document.getElementById('youtube-iframe');
                if (iframe) iframe.src = '';
                player.play().catch(e => console.error('Play error:', e));
                
                if (isPlayingAdvt) {
                    isAdvtPlaying = true;
                    inPrayer = false;
                    console.log('Now playing advt track (direct URL)!');
                } else if (isPlayingPrayer) {
                    inPrayer = true;
                    isAdvtPlaying = false;
                    console.log('Now playing prayer track!');
                } else {
                    inPrayer = false;
                    isAdvtPlaying = false;
                    mainTrackInfo = {...track};
                    console.log('Main track saved for resume: ' + track.title);
                }
                
                document.getElementById('current-track').innerText = 'Playing: ' + track.title;
                return;
            }
            
            try {
                const platform = track.platform || 'YouTube';
                const response = await fetch(`/api/play?url=${encodeURIComponent(track.url)}&platform=${encodeURIComponent(platform)}`);
                const data = await response.json();
                
                if (data.url) {
                    if (data.url.includes('youtube.com/embed')) {
                        // Use YouTube IFrame API for proper control
                        player.style.display = 'none';
                        let ytContainer = document.getElementById('youtube-container');
                        if (!ytContainer) {
                            ytContainer = document.createElement('div');
                            ytContainer.id = 'youtube-container';
                            ytContainer.style.cssText = 'position:fixed;bottom:80px;right:10px;width:200px;height:50px;z-index:9999;opacity:0.3;';
                            document.body.appendChild(ytContainer);
                        }
                        
                        // Extract video ID
                        const videoId = data.url.match(/\/embed\/([a-zA-Z0-9_-]{11})/)[1];
                        
                        // Load YouTube IFrame Player API
                        if (!window.YT || !window.YT.Player) {
                            const tag = document.createElement('script');
                            tag.src = 'https://www.youtube.com/iframe_api';
                            const firstScriptTag = document.getElementsByTagName('script')[0];
                            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                            window.onYouTubeIframeAPIReady = () => {
                                window.ytPlayer = new window.YT.Player('youtube-container', {
                                    videoId: videoId,
                                    playerVars: { autoplay: 1, loop: 1, controls: 1, modestbranding: 1 },
                                    events: { 'onStateChange': onYouTubeStateChange }
                                });
                            };
                        } else {
                            if (window.ytPlayer) {
                                window.ytPlayer.loadVideoById(videoId);
                            } else {
                                window.ytPlayer = new window.YT.Player('youtube-container', {
                                    videoId: videoId,
                                    playerVars: { autoplay: 1, loop: 1, controls: 1, modestbranding: 1 },
                                    events: { 'onStateChange': onYouTubeStateChange }
                                });
                            }
                        }
                        isYouTubePlaying = true;
                    }
                    
                    // Track which track is playing
                    if (isPlayingAdvt) {
                        isAdvtPlaying = true;
                        inPrayer = false;
                        console.log('Now playing advt track!');
                    } else if (isPlayingPrayer) {
                        inPrayer = true;
                        isAdvtPlaying = false;
                        console.log('Now playing prayer track!');
                    } else {
                        // This is the MAIN track - save for resume after advt/prayer
                        inPrayer = false;
                        isAdvtPlaying = false;
                        mainTrackInfo = {...track};
                        console.log('Main track saved for resume: ' + track.title);
                    }
                    
                    document.getElementById('current-track').innerText = 'Playing: ' + track.title;
                } else {
                    document.getElementById('current-track').innerText = 'Error: ' + (data.error || 'Could not load');
                }
            } catch (error) {
                console.error('Error playing track:', error);
            }
        }
        
        function playCurrent() {
            const player = document.getElementById('audio-player');
            if (isYouTubePlaying && window.ytPlayer) {
                // Resume YouTube
                window.ytPlayer.playVideo();
            } else if (player.src) {
                player.play();
            }
            document.getElementById('current-track').innerText = 'Playing: ' + (currentTrackTitle || 'track');
        }
        
        function pauseCurrent() {
            const player = document.getElementById('audio-player');
            player.pause();
            // Stop YouTube player if playing
            if (window.ytPlayer) {
                window.ytPlayer.pauseVideo();
            }
            isYouTubePlaying = false;
            document.getElementById('current-track').innerText = 'Paused: ' + (currentTrackTitle || 'track');
        }
        
        function nextTrack() {
            if (searchResults.length > 0) {
                const randomIndex = Math.floor(Math.random() * searchResults.length);
                playTrack(searchResults[randomIndex]);
            }
        }
        
        // Enter key to search
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
        
        // Search for advt track
        async function searchAdvt() {
            const query = document.getElementById('advt-query').value;
            if (!query) return;
            try {
                const response = await fetch('/api/search?q=' + encodeURIComponent(query));
                const results = await response.json();
                if (results.length > 0) {
                    advtTrack = results[0];
                    document.getElementById('advt-status').innerText = 'Advt: ' + advtTrack.title;
                    localStorage.setItem('advtTrack', JSON.stringify(advtTrack));
                }
            } catch(e) { console.error(e); }
        }
        
        // Search for prayer track  
        async function searchPrayer() {
            const query = document.getElementById('prayer-query').value;
            if (!query) return;
            try {
                const response = await fetch('/api/search?q=' + encodeURIComponent(query));
                const results = await response.json();
                if (results.length > 0) {
                    prayerTrack = results[0];
                    prayerTimes = document.getElementById('prayer-times').value.split(',').map(t => t.trim());
                    document.getElementById('prayer-status').innerText = 'Prayer: ' + prayerTrack.title + ' at ' + prayerTimes.join(', ');
                    localStorage.setItem('prayerTrack', JSON.stringify(prayerTrack));
                    localStorage.setItem('prayerTimes', JSON.stringify(prayerTimes));
                }
            } catch(e) { console.error(e); }
        }
        
        // Upload advt file - use Blob URL (browser memory)
        async function uploadAdvtFile() {
            const fileInput = document.getElementById('advt-file');
            if (!fileInput || !fileInput.files.length) return;
            const file = fileInput.files[0];
            
            // Create Blob URL for local playback
            const objectUrl = URL.createObjectURL(file);
            
            advtTrack = { 
                title: file.name, 
                url: objectUrl, 
                platform: 'Local',
                isBlob: true 
            };
            
            var statusEl = document.getElementById('advt-status');
            if (statusEl) statusEl.innerText = 'Advt: ' + advtTrack.title;
            alert('Advt track loaded!');
            
            startAdvtTimer();
        }
        
        // Upload prayer file - use Blob URL (browser memory)
        async function uploadPrayerFile() {
            const fileInput = document.getElementById('prayer-file');
            if (!fileInput || !fileInput.files.length) return;
            const file = fileInput.files[0];
            
            // Create Blob URL for local playback
            const objectUrl = URL.createObjectURL(file);
            
            prayerTrack = { 
                title: file.name, 
                url: objectUrl, 
                platform: 'Local',
                isBlob: true 
            };
            
            var statusEl = document.getElementById('prayer-status');
            if (statusEl) statusEl.innerText = 'Prayer: ' + prayerTrack.title;
            alert('Prayer track loaded!');
            
            startPrayerChecker();
        }
        
        // Save Ad Settings
        async function saveAdSettings() {
            try {
                var interval = parseInt(document.getElementById('advt-interval').value) || 300;
                var duration = parseInt(document.getElementById('advt-duration').value) || 30;
                
                var formData = new FormData();
                formData.append('interval_sec', interval);
                formData.append('play_duration_sec', duration);
                
                var response = await fetch('/api/settings/ad', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({interval_sec: interval, play_duration_sec: duration})
                });
                
                var result = await response.json();
                if (result.success) {
                    alert('Settings saved!');
                    startAdvtTimer(); // Restart with new settings
                } else {
                    alert('Failed to save: ' + result.error);
                }
            } catch(e) {
                console.error(e);
                alert('Failed to save: ' + e);
            }
        }
        
        // Save Prayer Settings
        async function savePrayerSettings() {
            try {
                var prayerTimesEl = document.getElementById('prayer-times');
                var times = prayerTimesEl.value;
                
                var response = await fetch('/api/settings/prayer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prayer_times: times})
                });
                
                var result = await response.json();
                if (result.success) {
                    alert('Settings saved!');
                    prayerTimes = times.split(',').map(t => t.trim());
                    startPrayerChecker(); // Restart with new times
                } else {
                    alert('Failed to save: ' + result.error);
                }
            } catch(e) {
                console.error(e);
                alert('Failed to save: ' + e);
            }
        }
        
        // Play/Pause/Delete advt
        function playAdvt() {
            if (advtTrack) playTrack(advtTrack);
        }
        
        function pauseAdvt() {
            const player = document.getElementById('audio-player');
            player.pause();
            document.getElementById('advt-status').innerText = 'Advt paused';
        }
        
        function deleteAdvt() {
            advtTrack = null;
            localStorage.removeItem('advtTrack');
            document.getElementById('advt-status').innerText = 'No advt track set';
        }
        
        // Play/Pause/Delete prayer
        function playPrayer() {
            if (prayerTrack) playTrack(prayerTrack);
        }
        
        function pausePrayer() {
            const player = document.getElementById('audio-player');
            player.pause();
            document.getElementById('prayer-status').innerText = 'Prayer paused';
        }
        
        function deletePrayer() {
            prayerTrack = null;
            prayerTimes = [];
            localStorage.removeItem('prayerTrack');
            localStorage.removeItem('prayerTimes');
            document.getElementById('prayer-status').innerText = 'No prayer track set';
        }
        
        // Start advt interval timer
        function startAdvtTimer() {
            var enabled = document.getElementById('advt-enabled');
            var intervalEl = document.getElementById('advt-interval');
            var durationEl = document.getElementById('advt-duration');
            
            if (!enabled || !intervalEl || !durationEl) {
                console.log('Elements not ready yet');
                return;
            }
            
            var enabled = enabled.checked;
            var interval = parseInt(intervalEl.value) || 300;
            var duration = parseInt(durationEl.value) || 30;
            console.log('startAdvtTimer: enabled=' + enabled + ', advtTrack=' + (advtTrack ? advtTrack.title : 'null') + ', interval=' + interval);
            
            // Save to database
            fetch('/api/settings/ad', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({interval_sec: interval, play_duration_sec: duration})
            }).catch(e => console.error('Failed to save ad settings:', e));
            
            if (advtTimer) clearInterval(advtTimer);
            
            if (!enabled || !advtTrack) {
                console.log('Advt timer NOT started');
                return;
            }
            
            // Use a 1-second interval for precise control
            advtTimer = setInterval(function() {
                // Check conditions
                if (!mainTrackInfo) {
                    // Reset counter when no main track
                    advtIntervalCounter = -1;
                    return;
                }
                
                var player = document.getElementById('audio-player');
                var audioPlaying = !player.paused && !player.ended;
                var youtubePlaying = isYouTubePlaying && window.ytPlayer && window.ytPlayer.getPlayerState() === 1;
                var isPlaying = audioPlaying || youtubePlaying;
                
                // Check if ad finished playing (state -2 means ad was playing)
                if (advtIntervalCounter === -2 && !isPlaying && mainTrackInfo) {
                    // Ad ended - resume main track from saved position
                    console.log('Advt ended - resuming main from ' + mainPausedTime);
                    advtIntervalCounter = -3;  // Temporary state while resuming
                    // Resume main track
                    playTrack(mainTrackInfo);
                    player.currentTime = mainPausedTime;
                    // After short delay, restart countdown
                    setTimeout(() => {
                        console.log('Restarting advt interval countdown...');
                        advtIntervalCounter = interval;
                    }, 1000);
                    return;  // Skip rest of this cycle
                }
                
                // Initialize counter when main track first starts playing
                if (advtIntervalCounter === -1 && isPlaying) {
                    console.log('Main track started - starting advt interval countdown');
                    advtIntervalCounter = interval;
                }
                
                // Countdown if active
                if (advtIntervalCounter > 0) {
                    advtIntervalCounter--;
                    // Only log occasionally to avoid spam
                    if (advtIntervalCounter % 30 === 0 || advtIntervalCounter === interval) {
                        console.log('Advt countdown: ' + advtIntervalCounter + 's remaining');
                    }
                }
                
                // Time to play ad!
                if (advtIntervalCounter === 0 && isPlaying && !isAdvtPlaying) {
                    console.log('Playing advt now!');
                    advtPlayCount++;
                    advtIntervalCounter = -2;  // Mark as waiting for ad to finish
                    
                    // Pause current player
                    if (youtubePlaying && window.ytPlayer) {
                        window.ytPlayer.pauseVideo();
                    } else {
                        player.pause();
                    }
                    playTrack(advtTrack);
                }
            }, 1000);
            
            console.log('Advt timer STARTED with countdown!');
        }
        
        // Start prayer time checker
        function startPrayerChecker() {
            if (!document.getElementById('prayer-enabled').checked || !prayerTrack) return;
            if (prayerChecker) clearInterval(prayerChecker);
            prayerChecker = setInterval(() => {
                const now = new Date();
                const timeStr = now.toTimeString().slice(0, 5);
                if (prayerTimes.includes(timeStr) && !inPrayer) {
                    // Save main track position before stopping
                    var player = document.getElementById('audio-player');
                    if (isYouTubePlaying && window.ytPlayer) {
                        mainPausedTime = window.ytPlayer.getCurrentTime() || 0;
                    } else {
                        mainPausedTime = player.currentTime || 0;
                    }
                    
                    // Stop all - main track and advertisement
                    console.log('Prayer starting - stopping all tracks');
                    inPrayer = true;
                    isAdvtPlaying = false;  // Stop ad
                    
                    // Stop main track
                    if (isYouTubePlaying && window.ytPlayer) {
                        window.ytPlayer.pauseVideo();
                    } else {
                        player.pause();
                    }
                    
                    // Hide YouTube iframe
                    const iframe = document.getElementById('youtube-iframe');
                    if (iframe) iframe.src = '';
                    
                    // Play prayer
                    console.log('Playing prayer: ' + prayerTrack.title);
                    playTrack(prayerTrack);
                    
                    // Schedule resume after prayer ends
                    const checkPrayerEnd = setInterval(() => {
                        if (!inPrayer) {
                            clearInterval(checkPrayerEnd);
                            return;
                        }
                        var audioPaused = player.paused || player.ended;
                        var ytNotPlaying = !isYouTubePlaying || (window.ytPlayer && window.ytPlayer.getPlayerState() !== 1);
                        if (audioPaused && ytNotPlaying) {
                            // Prayer ended - resume main
                            clearInterval(checkPrayerEnd);
                            console.log('Prayer ended - resuming main');
                            inPrayer = false;
                            if (mainTrackInfo) {
                                setTimeout(() => {
                                    console.log('Resuming main: ' + mainTrackInfo.title);
                                    playTrack(mainTrackInfo);
                                    player.currentTime = mainPausedTime;
                                    // Restart ad interval countdown
                                    var interval = parseInt(document.getElementById('advt-interval').value) || 300;
                                    advtIntervalCounter = interval;
                                }, 500);
                            }
                        }
                    }, 1000);
                }
            }, 1000);
        }
        
        // Restore saved tracks (skip invalid blobs from old sessions)
        function restoreSettings() {
            const savedAdvt = localStorage.getItem('advtTrack');
            if (savedAdvt) {
                try {
                    var advt = JSON.parse(savedAdvt);
                    // Check if blob URL is valid (starts with blob:)
                    if (advt.url && advt.url.startsWith('blob:')) {
                        console.log('Skipping old blob URL');
                    } else {
                        advtTrack = advt;
                        document.getElementById('advt-status').innerText = 'Advt: ' + advtTrack.title;
                    }
                } catch(e) { console.error(e); }
            }
            const savedPrayer = localStorage.getItem('prayerTrack');
            const savedTimes = localStorage.getItem('prayerTimes');
            if (savedPrayer && savedTimes) {
                try {
                    var prayer = JSON.parse(savedPrayer);
                    prayerTimes = JSON.parse(savedTimes);
                    if (prayer.url && prayer.url.startsWith('blob:')) {
                        console.log('Skipping old blob URL');
                    } else {
                        prayerTrack = prayer;
                        document.getElementById('prayer-status').innerText = 'Prayer: ' + prayerTrack.title + ' at ' + prayerTimes.join(', ');
                    }
                } catch(e) { console.error(e); }
            }
        }
        
        // Load tracks from database on startup
        async function loadFromDatabase() {
            console.log('Loading tracks from database...');
            
            try {
                // Load advertisement track
                var advtResp = await fetch('/api/track_info/ad');
                var advtData = await advtResp.json();
                if (advtData.found && advtData.url) {
                    advtTrack = { title: advtData.filename, url: advtData.url, platform: 'Local' };
                    var statusEl = document.getElementById('advt-status');
                    if (statusEl) statusEl.innerText = 'Advt: ' + advtData.filename;
                    console.log('Loaded advt track:', advtData.filename);
                }
                
                // Load prayer track
                var prayerResp = await fetch('/api/track_info/prayer');
                var prayerData = await prayerResp.json();
                if (prayerData.found && prayerData.url) {
                    prayerTrack = { title: prayerData.filename, url: prayerData.url, platform: 'Local' };
                    var prayerStatusEl = document.getElementById('prayer-status');
                    if (prayerStatusEl) prayerStatusEl.innerText = 'Prayer: ' + prayerData.filename;
                    console.log('Loaded prayer track:', prayerData.filename);
                }
                
                // Load interval and duration from database
                var settingsResp = await fetch('/api/settings/ad');
                var settingsData = await settingsResp.json();
                var intervalEl = document.getElementById('advt-interval');
                var durationEl = document.getElementById('advt-duration');
                if (intervalEl && settingsData.interval) intervalEl.value = settingsData.interval;
                if (durationEl && settingsData.duration) durationEl.value = settingsData.duration;
                
                // Start timers if tracks are loaded
                if (advtTrack) startAdvtTimer();
                if (prayerTrack) startPrayerChecker();
                
            } catch(e) {
                console.error('Failed to load from database:', e);
            }
        }
        
        // Initialize on page load
        window.onload = function() {
            // Load saved tracks from database
            loadFromDatabase();
            
            // Clock update
            setInterval(function() {
                var now = new Date();
                document.getElementById('current-clock').innerText = now.toLocaleTimeString();
            }, 1000);
            
            // Player ended event - resume main after advt
            var player = document.getElementById('audio-player');
            player.addEventListener('ended', function() {
                if (isAdvtPlaying && mainTrackInfo) {
                    console.log('Advt ended (event), resuming main');
                    const wasAdvt = isAdvtPlaying;
                    isAdvtPlaying = false;
                    setTimeout(function() {
                        if (wasAdvt && mainTrackInfo) {
                            console.log('Resuming main track: ' + mainTrackInfo.title);
                            playTrack(mainTrackInfo);
                            player.currentTime = mainPausedTime;
                        }
                    }, 500);
                }
            });
            
            // Periodically check if ad finished playing (fallback for reliable detection)
            setInterval(function() {
                if (isAdvtPlaying) {
                    var audioPlaying = !player.paused && !player.ended;
                    if (!audioPlaying) {
                        // Ad stopped - check if it was actually playing via playCount
                        if (advtPlayCount > 0 && advtPlayCount === advtPlayFinished) {
                            // Ad finished - resume main
                            console.log('Advt ended (poll), resuming main');
                            const wasAdvt = isAdvtPlaying;
                            isAdvtPlaying = false;
                            if (mainTrackInfo) {
                                console.log('Resuming main track: ' + mainTrackInfo.title);
                                playTrack(mainTrackInfo);
                                player.currentTime = mainPausedTime;
                            }
                        }
                    }
                }
            }, 1000);
            
            restoreSettings();
            // Delay timer start to ensure elements exist
            setTimeout(function() {
                startAdvtTimer();
                startPrayerChecker();
            }, 100);
            
            document.getElementById('advt-enabled').addEventListener('change', startAdvtTimer);
            document.getElementById('prayer-enabled').addEventListener('change', startPrayerChecker);
        };
    </script>
</body>
